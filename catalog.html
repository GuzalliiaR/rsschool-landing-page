<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtragleam</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="icon" type="image/png" href="./icon/favicon/favicon.png">
    <link rel="icon" type="image/svg+xml" href="./icon/favicon/favicon.svg">
</head>
<body>
    <div class="container">
        <load src="partials/header.html" homeClass="" catalogClass="open-page" />
    
        <main>
            <h2 class="visually-hidden">Catalog Page</h2>
            <section>
                <h3 class="catalog__title">Catalog</h3>
                
                <nav class="categories">
                    <button class="category-btn active" type="button" data-filter="all">All</button>
                    <button class="category-btn" type="button" data-filter="face">For face</button>
                    <button class="category-btn" type="button" data-filter="body">For body</button>
                </nav>

                <template id="card-template">
                    <article class="card">
                        <img src="" alt="">
                        <div class="card__description">
                            <h4 class="card__subtitle"></h4>
                            <p><span class="size-default"></span> / &dollar;<span class="price"></span></p>
                        </div>
                    </article>
                </template>

                <div class="catalog-grid" id="catalog"></div>
            
                <button class="moreCards-btn" id="moreCards-btn" type="button">Show More</button>
            </section>
        </main>
    </div>
    
    <load src="partials/footer.html" />
    <load src="partials/burger-menu.html" />

    <template id="modalCard__template">
        <div class="modalCard__content">
            <div class="modalCard__imgContent">
                <img class="modalCard__img" src="" alt="">
            </div>

            <div class="modalCard__info">
                <div class="modalCard__block">
                    <h3 class="modalCard__title"></h3>
                    <p class="modalCard__description"></p>
                </div>

                <div class="modalCard__block">
                    <h4 class="modalCard__subtitle">Size</h4>
                    <div class="modalCard__choseSize">
                        <button class="btnSize visually-hidden" type="button"></button>
                    </div>
                </div>

                <div class="modalCard__block">
                    <h4 class="modalCard__subtitle">Skin type</h4>
                    <div class="modalCard__choseSkinType">
                        <button class="btnSkinType visually-hidden" type="button"></button>
                    </div>
                </div>

                <div class="modalCard__block">
                    <h4 class="modalCard__subtitle">Presence of fragrance</h4>
                    <div class="modalCard__choseSmell">
                        <button class="btnSmell visually-hidden" type="button"></button>
                    </div>
                </div>

                <p class="modalCard__totalPrice">
                    <span>Total:</span> <span>&dollar;<span class="price"></span></span>
                </p>

                <button id="closeModalCardBtn" type="button">Close</button>
            </div>
        </div>
    </template>
    <dialog id="modalCard"></dialog>

    <script type="module" src="./src/js/pages/catalog.js"></script>
</body>
</html>
