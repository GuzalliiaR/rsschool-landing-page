<header>
    <a class="logo" href="https://guzalliiar.github.io/rsschool-landing-page/" target="_self">
        <img class="logo__img logo__img--light" src="./icon/logo.svg" alt="Logo" loading="lazy" width="54" height="58">
        <img class="logo__img logo__img--dark" src="./icon/logo-light.svg" alt="Logo" loading="lazy" width="54"
            height="58">
        <h1 class="logo__title">
            <span class="logo__title_font1">trag</span><span class="logo__title_font2">leam</span>
        </h1>
    </a>

    <!-- class="open-page" -->
    <nav class="header__nav">
        <ul class="heder-menu">
            <li>
                <a class="{=$homeClass}" href="./index.html">Home</a>
            </li>
            <li>
                <a class="{=$catalogClass}" href="./catalog.html">Catalog</a>
            </li>
            <li>
                <a href="./index.html#about">About us</a>
            </li>
            <li>
                <a href="./index.html#reviews">Reviews</a>
            </li>
            <li>
                <a href="#contacts">Contacts</a>
            </li>
        </ul>
    </nav>

    <div class="header__actions">

                    stroke-linejoin="round" />
            </svg>
            <svg class="burger__img burger__icon--close" width="40" height="40" viewBox="0 0 32 32"
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <title></title>
                <g id="cross">
                    <line x1="7" x2="25" y1="7" y2="25" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2" />
                    <line x1="7" x2="25" y1="25" y2="7" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2" />
                </g>
            </svg>
        </button>

        <button class="btn-them" id="theme-toggle" title="Change theme" type="button">
            <img class="theme-toggle__icon--light" src="./icon/sun.svg" alt="light theme" loading="lazy" width="50"
                height="50">
            <img class="theme-toggle__icon--dark" src="./icon/moon.svg" alt="dark theme" loading="lazy" width="50"
                height="50">
